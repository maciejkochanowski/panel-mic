name: Publish verified distribution
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry with a configured Trusted Publisher
        type: choice
        options: [testpypi, pypi]
        default: testpypi
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]" twine
      - run: python -m pytest
      - run: python examples/library/tutorial.py
      - run: python examples/library/qc_profile.py
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.registry }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.registry == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.registry == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
