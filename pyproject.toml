[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "panel-mic"
dynamic = ["version"]
description = "High-quantile upper-panel assessment and robust future-certification design"
readme = "README-library.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Maciej Kochanowski"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis", "build", "jsonschema", "setuptools>=77", "wheel"]
plot = ["matplotlib>=3.8"]
data = ["openpyxl>=3.1", "xlrd>=2", "pypdf>=6"]
docs = ["reportlab>=4.4", "Markdown>=3.7", "pypdf>=6", "PyMuPDF>=1.24.3"]
[project.scripts]
panel-mic = "panel_mic.cli:main"
[project.urls]
Repository = "https://github.com/maciejkochanowski/panel-mic"
Documentation = "https://github.com/maciejkochanowski/panel-mic/tree/main/docs/library"
Issues = "https://github.com/maciejkochanowski/panel-mic/issues"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.dynamic]
version = {attr = "panel_mic._version.__version__"}
[tool.setuptools.package-data]
panel_mic = ["schemas/*.json", "py.typed"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
[tool.coverage.run]
source = ["panel_mic"]
branch = true
[tool.coverage.report]
show_missing = true
